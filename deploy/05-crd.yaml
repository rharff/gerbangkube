apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagesignaturepolicies.gerbangkube.example.io
spec:
  group: gerbangkube.example.io
  scope: Cluster
  names:
    plural: imagesignaturepolicies
    singular: imagesignaturepolicy
    kind: ImageSignaturePolicy
    shortNames: [isp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [imageReferences, publicKeySecretRef]
              properties:
                imageReferences:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                publicKeySecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string, minLength: 1}
                    key: {type: string, minLength: 1}
