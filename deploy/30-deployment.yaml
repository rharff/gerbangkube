apiVersion: v1
kind: Service
metadata:
  name: gerbangkube
  namespace: gerbangkube-system
spec:
  selector: {app: gerbangkube}
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gerbangkube
  namespace: gerbangkube-system
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gerbangkube}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gerbangkube
  namespace: gerbangkube-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: gerbangkube}
  template:
    metadata:
      labels: {app: gerbangkube}
    spec:
      serviceAccountName: gerbangkube
      containers:
        - name: gerbangkube
          image: ghcr.io/rharff/gerbangkube:5
          args:
            - --listen-address=:8443
            - --docker-config-dir=/registry-auth
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: registry-auth, mountPath: /registry-auth, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: gerbangkube-tls
        - name: registry-auth
          secret:
            secretName: ghcr-read-auth
