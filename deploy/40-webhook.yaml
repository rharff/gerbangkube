apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gerbangkube
  annotations:
    cert-manager.io/inject-ca-from: gerbangkube-system/gerbangkube-tls
webhooks:
  - name: pods.gerbangkube.example.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 15
    clientConfig:
      service:
        name: gerbangkube
        namespace: gerbangkube-system
        path: /validate
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, gerbangkube-system, cert-manager]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
